project:
  type: embedded-svelte-app-with-backend-data

versioning:
  scheme: app-milestone
  tag_format: vMAJOR.MINOR
  release_title_format: "vX.Y - Plain-English Milestone"

milestone_threshold:
  create_release_for:
    - meaningful forecasting, data pipeline, frontend exploration, embedding, or hosting milestones
    - source-data updates that materially change published outputs or interpretation
    - changes that materially improve the public embedded app experience
  skip_release_for:
    - staged bundle uploads without source behavior changes
    - local dependency refreshes without user-facing impact
