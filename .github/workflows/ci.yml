name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      svelte-lib-ref:
        description: svelte-lib ref used for the local file dependency.
        required: false
        type: string
        default: dev

jobs:
  node-package-ci:
    uses: cyaris/svelte-lib/.github/workflows/node-package-ci.yml@dev
    with:
      working-directory: frontend
      svelte-lib-ref: ${{ github.event_name == 'workflow_dispatch' && inputs.svelte-lib-ref || vars.SVELTE_LIB_REF || 'dev' }}
    secrets: inherit
